name: Deploy do site

on:
  push:
    branches: [main]
    # Only what the site is built from: the weekly keepalive commit and scraper changes never redeploy it.
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build e deploy (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      # OpenNext bundles every .env file it finds into the Worker, so the site is only ever built here, where
      # none exists.
      - name: Build (OpenNext)
        working-directory: apps/web
        env:
          # The home page and the sitemaps are built from the database: web_ro, read-only, through the IPv4
          # Session pooler (the runners have no IPv6).
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.WEB_BUILD_DATABASE_URL }}
          # The admin pages' Supabase Auth. Public values (the publishable key is made for browsers), so variables
          # rather than secrets; next build writes them into the Worker.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      # Secrets survive deploys; setting them each time keeps GitHub the one place to change them.
      - name: Segredos do Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: printf '%s' "$REVALIDATE_SECRET" | pnpm exec wrangler secret put REVALIDATE_SECRET
