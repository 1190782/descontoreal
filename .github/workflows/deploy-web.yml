name: Deploy do site

on:
  push:
    branches: [main]
    # Only what the site is built from: the weekly keepalive commit and scraper changes never redeploy it.
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build e deploy (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      # OpenNext bundles every .env file it finds into the Worker, so the site is only ever built here, where
      # none exists.
      - name: Build (OpenNext)
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy
